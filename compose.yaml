services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby_dev
      POSTGRES_DB: lobby
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
